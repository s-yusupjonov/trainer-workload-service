# "standalone" profile: run trainer-workload-service in Docker with integrations disabled
#   - registry : Eureka client disabled
#   - queue    : JMS listener container does not start (no broker connection attempts)
#   - MongoDB  : connects lazily, so the app starts without it; its health check is switched off
#                (workload endpoints that read/write Mongo will fail until a DB is available)
# Activate with:  -e SPRING_PROFILES_ACTIVE=standalone
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

spring.jms.listener.auto-startup=false
management.health.jms.enabled=false
management.health.mongo.enabled=false
management.endpoint.health.show-details=always
