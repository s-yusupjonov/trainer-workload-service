spring.application.name=trainer-workload-service

server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info

internal-auth.secret=${INTERNAL_JWT_SECRET:th1s-is-a-shared-dev-only-internal-secret-override-in-prod}
internal-auth.allowed-callers=${INTERNAL_AUTH_ALLOWED_CALLERS:gym-crm}

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

activemq.queue.workload-events=${WORKLOAD_EVENTS_QUEUE:workload.events.queue}
activemq.queue.workload-events-dlq=${WORKLOAD_EVENTS_DLQ:workload.events.dlq}
